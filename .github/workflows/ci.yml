name: Test GhostBridge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - run: node --check docs/filters.mjs
      - run: node --check docs/correlator.mjs
      - run: node --check docs/fixture_replay.mjs
      - run: node --check docs/fixtures.js
      - run: node --check docs/reconstruction.mjs
      - run: node --check docs/reconstruction-view.mjs
      - run: node --check docs/playback.mjs
      - run: node --check docs/signal_forge.mjs
      - run: node --test tests/browser.test.mjs
      - run: node --test tests/filter.test.mjs
      - run: node --test tests/correlator.test.mjs
      - run: node --test tests/reconstruction.test.mjs
      - run: node --test tests/reconstruction-view.test.mjs
      - run: node --test tests/playback.test.mjs
      - run: node --test tests/signal_forge.test.mjs
