name: Publish synthetic lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - run: node --check docs/filters.mjs
      - run: node --check docs/correlator.mjs
      - run: node --check docs/fixture_replay.mjs
      - run: node --check docs/fixtures.js
      - run: node --check docs/reconstruction.mjs
      - run: node --check docs/reconstruction-view.mjs
      - run: node --check docs/playback.mjs
      - run: node --check docs/signal_forge.mjs
      - run: node --check docs/engine.mjs
      - run: node --check docs/control_room.mjs
      - run: node --check docs/control_room_scene.mjs
      - run: node --check docs/control_room_view.mjs
      - run: node --check docs/showcase.mjs
      - run: node --check docs/showcase_view.mjs
      - run: node --test tests/browser.test.mjs
      - run: node --test tests/filter.test.mjs
      - run: node --test tests/correlator.test.mjs
      - run: node --test tests/reconstruction.test.mjs
      - run: node --test tests/reconstruction-view.test.mjs
      - run: node --test tests/playback.test.mjs
      - run: node --test tests/signal_forge.test.mjs
      - run: node --test tests/control_room.test.mjs
      - run: node --test tests/showcase.test.mjs
      - run: node --test tests/property.test.mjs
      - run: node --test tests/forge-parity.test.mjs
      - run: node --test tests/control_room_wiring.test.mjs
      - run: node --test tests/guard.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
